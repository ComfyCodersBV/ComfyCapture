<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout</title></head>
<body>
<form action="/done.html" method="get">
  <label for="email">Email</label>
  <input id="email" name="email" type="email">
  <label>Password <input name="password" type="password"></label>
  <label><input type="checkbox" name="terms"> I agree</label>
  <label for="country">Country</label>
  <select id="country" name="country"><option value="nl">Netherlands</option><option value="be">Belgium</option></select>
  <input wire:model.live="search" placeholder="Search products">
  <button type="submit">Place order</button>
</form>
</body>
</html>
