[project]
name = "comfycapture"
version = "0.3.1"
description = "Record browser tests once, replay them on demand and on a schedule."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ComfyCoders" }]
dependencies = [
    "faker>=37",
    "keyring>=25.6",
    "platformdirs>=4.3",
    "playwright==1.63.0",
]

[project.optional-dependencies]
desktop = [
    "PySide6-Essentials>=6.11,<6.12",
]

[project.scripts]
comfycapture = "comfycapture.cli:main"

[project.gui-scripts]
comfycapture-desktop = "comfycapture.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
package = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfycapture"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PTH", "ANN", "FA"]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["comfycapture"]
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs a Playwright browser (headless)",
    "gui: needs PySide6",
]
