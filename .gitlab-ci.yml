stages:
  - check
  - test
  - release

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_FROZEN: "1"
  PACKAGE_NAME: browsertests
  APP_NAME: BrowsertestSuite
  RELEASE_TARGETS: "linux-x86_64.tar.gz macos-arm64.zip windows-x86_64.zip"

.on-change:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.linux:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  interruptible: true
  cache:
    key: uv-linux
    paths:
      - .cache/uv

lint:
  extends:
    - .linux
    - .on-change
  stage: check
  script:
    - uv sync --group dev
    - uv run ruff check .
    - uv run ruff format --check .

core-headless:
  extends: .on-change
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.63.0-noble
  interruptible: true
  variables:
    UV_PYTHON_PREFERENCE: only-system
  before_script:
    - pip install --break-system-packages uv
  script:
    - uv sync --group dev
    - uv run pytest -q

desktop-linux:
  extends:
    - .linux
    - .on-change
  stage: test
  variables:
    QT_QPA_PLATFORM: offscreen
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 > /dev/null
  script:
    - uv sync --all-extras --group dev
    - uv run playwright install --with-deps chromium
    - uv run pytest -q

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache curl > /dev/null
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - grep -q "^version = \"$VERSION\"$" pyproject.toml || { echo "Tag $CI_COMMIT_TAG does not match pyproject.toml" >&2; exit 1; }
    - REGISTRY="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION"
    - |
      set -- release-cli create --name "$APP_NAME $VERSION" --tag-name "$CI_COMMIT_TAG" \
        --description "$APP_NAME $VERSION. Download the archive for your OS below; see packaging/RELEASING.md for installing."
      for target in $RELEASE_TARGETS; do
        FILE="$APP_NAME-$VERSION-$target"
        if ! curl --fail --silent --head --header "JOB-TOKEN: $CI_JOB_TOKEN" "$REGISTRY/$FILE" > /dev/null; then
          echo "Missing $FILE in the package registry: build and upload it first (packaging/RELEASING.md)." >&2
          exit 1
        fi
        set -- "$@" --assets-link "{\"name\":\"$FILE\",\"url\":\"$REGISTRY/$FILE\",\"link_type\":\"package\"}"
        set -- "$@" --assets-link "{\"name\":\"$FILE.sha256\",\"url\":\"$REGISTRY/$FILE.sha256\",\"link_type\":\"other\"}"
      done
      "$@"
